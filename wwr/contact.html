        <section class="contact-us">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d127674.15615585606!2d-78.3821082576174!3d-0.03933998256268122!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sec!4v1780752285368!5m2!1sen!2sec"
                  width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <form>
                <div class="form-item column2">
                    <label for="name">Name</label>
                    <input type="text" name="name" id="name" placeholder="Name">
                </div>

                <div class="form-item column2">
                    <label for="email">Email</label>
                    <input type="text" name="email" id="email" placeholder="Email">
                </div>

                <div class="form-item column2">
                    <p class="radio-title">Message Purpose</p>
                    <div class="radio-options-container">
                        <div class="radio-options">
                            <input type="radio" id="inquiry" name="action" value="inquiry" checked>
                            <label for="inquiry">General Inquiry</label>
                        </div>
                        <div class="radio-options">
                            <input type="radio" id="reservation" name="action" value="reservation">
                            <label for="reservation">Reservation Question</label>
                        </div>
                        <div class="radio-options">
                            <input type="radio" id="suggestion" name="action" value="suggestion">
                            <label for="suggestion">Website Suggestion</label>
                        </div>
                    </div>
                </div>
                <label for="message">Message</label>
                <textarea name="message" id="message" rows="4"
                  placeholder="Type your message here..."></textarea>

                <div class="subscription-container">
                    <input type="checkbox" id="subscription" name="subscription">
                    <label for="subscription">Please Subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/employee1.webp" alt="Carlos Mendoza profile photo">
                <figcaption><strong>Carlos Mendoza</strong> <br>
                    River Operations Director</figcaption>
            </figure>
            <figure>
                <img src="images/employee3.webp" alt="Alex Rivera profile photo">

            </figure>
            <figure>
                <img src="images/employee2.webp" alt="Sarah Jenkins profile photo">
                <figcaption><strong>Sarah Jenkins</strong> <br>
                    Lead Expedition Guides</figcaption>
            </figure>
        </section>
